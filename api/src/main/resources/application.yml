spring:
  application:
    name: frenchpress-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:frenchpress}
    username: ${DB_USERNAME:frenchpress}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,email,profile

server:
  port: 8080

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: dev
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    # Testcontainers' @ServiceConnection overrides the actual connection at
    # runtime, but Spring still resolves this placeholder while binding
    # DataSourceProperties — an explicit test-only value here means the
    # `test` profile never depends on a real DB_PASSWORD being present in
    # the shell/CI environment, while dev/prod still get no default and
    # fail fast if DB_PASSWORD is missing.
    password: test
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
