spring:
  application:
    name: frenchpress-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:frenchpress}
    username: ${DB_USERNAME:frenchpress}
    password: ${DB_PASSWORD:frenchpress}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy}
            scope: openid,email,profile

server:
  port: 8080

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: dev
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: test
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
